name: Deploy portfolio to GitHub Pages

# The repo also holds the Django app (moviesstore/), so this only builds and
# deploys the standalone static site in portfolio/ — it never touches Django.
on:
  push:
    branches: [main]
    paths: ["portfolio/**", ".github/workflows/deploy-portfolio.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push cancels an in-flight one rather
# than queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload portfolio/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
